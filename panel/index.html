<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de decisiones</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --hover: rgba(11, 11, 11, 0.045);
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --track: #cde2fb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --good-text: #006300;
  --sev-crit: #d03b3b; --sev-high: #ec835a; --sev-med: #fab219; --sev-low: #86b6ef;
  --banner-bg: #fff4d6; --banner-ink: #5c4300;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a09e97;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10); --hover: rgba(255, 255, 255, 0.06);
    --accent: #3987e5; --track: #0d366b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-text: #0ca30c; --sev-low: #3987e5;
    --banner-bg: #3a2f0a; --banner-ink: #f5dc9a; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a09e97;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10); --hover: rgba(255, 255, 255, 0.06);
  --accent: #3987e5; --track: #0d366b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-text: #0ca30c; --sev-low: #3987e5;
  --banner-bg: #3a2f0a; --banner-ink: #f5dc9a; --shadow: none;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }

/* banner de datos de ejemplo */
.demo-banner {
  position: sticky; top: 0; z-index: 20; margin: 0; padding: 8px 16px;
  background: var(--banner-bg); color: var(--banner-ink); font-weight: 600; text-align: center;
  border-bottom: 1px solid var(--border);
}

/* cabecera */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding: 20px 0 12px; }
.top h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.top .sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.sources { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); font-size: 12px; color: var(--ink-2); white-space: nowrap;
}
.chip svg { flex: none; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
.btn:hover { background: var(--hover); }
.btn[aria-pressed="true"] { border-color: var(--accent); }
.btn.icon { padding: 6px 9px; }

/* tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--grid); margin-bottom: 14px; scrollbar-width: thin; }
.tab {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer;
  color: var(--ink-2); white-space: nowrap; font-weight: 500; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 650; }
.tab .count { margin-left: 6px; font-size: 12px; padding: 0 6px; border-radius: 999px; background: var(--crit); color: #fff; }

/* una sola fila de filtros, arriba de todo */
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 16px; }
.filters label { color: var(--ink-2); font-size: 13px; margin-right: 6px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--hover); }
.seg button[aria-checked="true"] { font-weight: 650; box-shadow: inset 0 -2px 0 var(--accent); }
select { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 28px 6px 10px; }
.filters .grow { flex: 1; }
.updated { color: var(--muted); font-size: 12px; }

/* tarjetas */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.col-12 { grid-column: span 12; } .col-8 { grid-column: span 8; } .col-6 { grid-column: span 6; }
.col-4 { grid-column: span 4; } .col-3 { grid-column: span 3; }
@media (max-width: 980px) { .col-8, .col-6, .col-4 { grid-column: span 12; } .col-3 { grid-column: span 6; } }
@media (max-width: 560px) { .col-3 { grid-column: span 12; } }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow);
  min-width: 0; transition: opacity .15s;
}
.busy .card { opacity: .55; }
.card header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.card h2 { margin: 0; font-size: 15px; font-weight: 650; }
.card .sub { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.card .tools { display: flex; gap: 6px; flex: none; }
.link-btn { background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 2px 6px; border-radius: 6px; font-size: 12.5px; }
.link-btn:hover { background: var(--hover); color: var(--ink); }
.empty { color: var(--ink-2); padding: 18px 4px; }
.callout {
  display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 8px;
  background: var(--hover); color: var(--ink-2); font-size: 13px;
}
.callout.err { border-left: 3px solid var(--crit); }

/* hero + kpi */
.hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.hero .num { font-size: 56px; font-weight: 650; line-height: 1; letter-spacing: -0.02em; }
.hero .txt { font-size: 15px; color: var(--ink-2); }
.hero .txt b { color: var(--ink); }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .label { color: var(--ink-2); font-size: 12.5px; }
.kpi .value { font-size: 28px; font-weight: 650; line-height: 1.1; }
.kpi .value small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.kpi .delta { font-size: 12.5px; color: var(--ink-2); }
.kpi .spark { height: 28px; margin-top: 2px; }

/* lista "qué atender" */
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: grid; grid-template-columns: 112px 1fr auto; gap: 10px 14px; padding: 10px 0; border-top: 1px solid var(--grid); align-items: start; }
.todo li:first-child { border-top: 0; }
.todo .t { font-weight: 600; }
.todo .d { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
@media (max-width: 640px) { .todo li { grid-template-columns: 1fr; } }
.sev {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 8px 2px 6px;
  border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; color: var(--ink);
}
.sev svg { flex: none; }

/* tablas */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 6px 10px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td, tr.sel td { background: var(--hover); }
td .muted { color: var(--muted); }
.muted { color: var(--muted); }

/* medidor */
.meter { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.meter .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.meter .bar i.w { background: var(--warn); } .meter .bar i.c { background: var(--crit); }
.meter span { font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }

/* gráficos */
.chart { width: 100%; min-height: 40px; position: relative; }
.chart svg { display: block; overflow: visible; }
.chart text { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; }
.legend i.rect { width: 10px; height: 10px; border-radius: 2px; }
.legend i.line { width: 16px; height: 0; border-top: 2px solid; }
.legend i.dash { width: 16px; height: 0; border-top: 2px dashed; }
.tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  max-width: 320px; display: none;
}
.tip .h { color: var(--ink-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r b { font-weight: 650; margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
.tip .k { display: inline-block; width: 12px; height: 0; border-top: 2px solid; flex: none; }
.tip .k.rect { height: 9px; border-top: 0; width: 9px; border-radius: 2px; }

.two { display: grid; gap: 14px; grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 980px) { .two { grid-template-columns: 1fr; } }
.mini-h { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.note { color: var(--ink-2); font-size: 12.5px; margin-top: 8px; }

@media (forced-colors: active) { .meter .bar i { background: Highlight; } }
@media print { .filters, .tabs, .btn, .tools { display: none !important; } .card { break-inside: avoid; } }

/* barras horizontales */
.hbar { display: grid; gap: 7px; }
.hb { display: grid; grid-template-columns: minmax(80px, 190px) minmax(0, 1fr) minmax(70px, auto); gap: 10px; align-items: center; font-size: 13px; }
.hb .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .area { height: 10px; position: relative; }
.hb .area.track { background: var(--track); border-radius: 5px; }
.hb .area .b { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hb .area.track .b { border-radius: 5px; }
.hb .area.stack .segs { display: flex; gap: 2px; height: 100%; }
.hb .area.stack .segs i { display: block; border-radius: 2px; min-width: 2px; }
.hb .v { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 560px) { .hb { grid-template-columns: minmax(70px, 110px) minmax(0, 1fr) auto; gap: 6px; } }
.row-gap { display: grid; gap: 14px; }
.hint { color: var(--ink-2); font-size: 12.5px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--hover); font-size: 12px; color: var(--ink-2); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; }
.steps li { counter-increment: st; position: relative; padding: 10px 0 10px 38px; border-top: 1px solid var(--grid); }
.steps li:first-child { border-top: 0; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 10px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--axis); display: grid; place-items: center; font-weight: 650; font-size: 13px; }
.steps .t { font-weight: 600; }
.steps .d { color: var(--ink-2); font-size: 13px; margin-top: 2px; }

/* ===== v2: cabecera, tablero, panel de detalle, modo pantalla ===== */
.top h1 { display: flex; align-items: center; gap: 10px; }
.logo { flex: none; }
input[type="search"] { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-width: 240px; font: inherit; color: inherit; }
.sevbar { display: flex; gap: 2px; height: 10px; margin: 14px 0 8px; max-width: 560px; }
.sevbar i { display: block; border-radius: 2px; min-width: 6px; }
.sevlegend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
.sevlegend span { display: inline-flex; align-items: center; gap: 6px; }
.more { margin-top: 8px; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); }
.tile {
  text-align: left; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--tc, var(--axis));
  border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 9px; color: inherit; font: inherit;
  transition: background .12s, box-shadow .12s;
}
.tile:hover { background: var(--hover); box-shadow: 0 2px 10px rgba(0, 0, 0, .08); }
.t-crit { --tc: var(--sev-crit); } .t-high { --tc: var(--sev-high); } .t-med { --tc: var(--sev-med); } .t-low { --tc: var(--sev-low); } .t-ok { --tc: var(--good); }
.tile .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tile .nm { font-weight: 650; overflow-wrap: anywhere; }
.tile .rl { color: var(--muted); font-size: 12.5px; }
.mini { display: grid; grid-template-columns: 40px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.mini .bar { height: 6px; border-radius: 3px; background: var(--track); }
.mini .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.mini .bar i.w { background: var(--warn); } .mini .bar i.c { background: var(--crit); }
.mini .val { text-align: right; font-variant-numeric: tabular-nums; }
.tile .ft { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.tile .ft span { display: inline-flex; align-items: center; gap: 5px; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .38); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--page); border-left: 1px solid var(--border);
  z-index: 41; overflow-y: auto; box-shadow: -10px 0 30px rgba(0, 0, 0, .22); animation: slidein .18s ease-out;
}
@keyframes slidein { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
.drawer .dh { position: sticky; top: 0; z-index: 2; background: var(--page); padding: 16px 18px 12px; border-bottom: 1px solid var(--grid); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer .dh h2 { margin: 0 0 2px; font-size: 18px; }
.drawer .db { padding: 14px 18px 32px; display: grid; gap: 18px; }
.dsec h3 { font-size: 13.5px; margin: 0 0 8px; font-weight: 650; }
.dstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.dstat .l { color: var(--ink-2); font-size: 12px; margin-bottom: 2px; }
.vgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.vcell { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.vcell .n { font-size: 20px; font-weight: 650; }
.vcell .l { font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.vcell .l i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.dlist { list-style: none; margin: 0; padding: 0; }
.dlist li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--grid); }
.dlist li:first-child { border-top: 0; }
.dlist .d { color: var(--ink-2); font-size: 12.5px; grid-column: 2; }
.drow { display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.dacts { display: flex; flex-wrap: wrap; gap: 8px; }
/* modo pantalla */
.tvbar { display: none; position: relative; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--grid); margin-bottom: 14px; }
.tvbar .grow { flex: 1; }
.tvbar .prog { position: absolute; left: 0; bottom: -1px; height: 3px; background: var(--accent); width: 100%; transform-origin: left; animation: tvprog 20s linear forwards; }
@keyframes tvprog { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.tv .tvbar { display: flex; }
.tv .filters, .tv .tabs, .tv .top .sub, .tv .demo-banner { display: none; }
.tv .tvbar #tv-title { font-size: 22px; }
.tv body, html.tv body { font-size: 16px; }
.tv .app { max-width: 1760px; }
.tv .todo .btn, .tv .card .tools { display: none; }
.tv .hero .num { font-size: 72px; }
.tv .more { display: none; }

</style>
</head>
<body>
<div id="demo-banner" class="demo-banner" hidden>DATOS DE EJEMPLO: no son los valores reales de tus equipos. Abrí la página desde tu servidor, sin ?demo=1, para ver los datos en vivo.</div>
<div class="app" id="app">
  <div class="top">
    <div>
      <h1><svg class="logo" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="var(--accent)"/><path d="M4.5 14h4l2.2-6 3.4 11 2.3-5h4.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Panel de decisiones</h1>
      <div class="sub">Zabbix + Wazuh · infraestructura del datacenter</div>
    </div>
    <div class="sources" id="sources" aria-live="polite"></div>
  </div>
  <div class="tvbar" id="tvbar"><strong id="tv-title"></strong><span class="muted" id="tv-clock"></span><span class="grow"></span><span class="muted">Rota cada 20 s</span><button class="btn" id="tv-exit" type="button">Salir (Esc)</button><i class="prog" id="tv-prog"></i></div>
  <div class="tabs" role="tablist" id="tabs" aria-label="Vistas"></div>
  <div class="filters" id="filters">
    <div><label id="lbl-win">Ventana de tendencia</label>
      <span class="seg" role="radiogroup" aria-labelledby="lbl-win" id="win"></span></div>
    <div id="host-wrap"><label for="host">Equipo</label><select id="host"></select></div>
    <div id="q-wrap"><label for="q" class="sr-only">Buscar equipo o problema</label><input id="q" type="search" placeholder="Buscar equipo o problema  ( / )" autocomplete="off"></div>
    <div id="sev-wrap"><label id="lbl-sev">Mostrar</label><span class="seg" role="radiogroup" aria-labelledby="lbl-sev" id="sevf"></span></div>
    <span class="grow"></span>
    <span class="updated" id="updated"></span>
    <button class="btn" id="auto" type="button" aria-pressed="false" title="Actualiza los datos solo, cada 5 minutos">Auto: apagado</button>
    <button class="btn" id="tvbtn" type="button" title="Vista limpia que rota entre pestañas, para dejar en un monitor">Modo pantalla</button>
    <button class="btn" id="refresh" type="button">Actualizar</button>
    <button class="btn icon" id="theme" type="button" aria-label="Cambiar tema claro u oscuro" title="Tema"></button>
  </div>
  <main id="main" tabindex="-1"></main>
</div>
<div id="tip" class="tip" role="tooltip"></div>

<script>
'use strict';
/* ===== helpers de DOM (todo con textContent: nunca innerHTML con datos) ===== */
const SVGNS = 'http://www.w3.org/2000/svg';

function setAttrs(el, attrs, isSvg) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k === 'text') el.textContent = v;

'use strict';
/* ===== estado, modelo y motor de "qué atender hoy" ===== */
const VIEWS = [
  { id: 'resumen', name: 'Resumen', win: false, host: false },
  { id: 'capacidad', name: 'Capacidad', win: true, host: true },

];
const state = { raw: {}, anon: false, view: 'resumen', days: 60, host: 'all', demo: false, data: {}, busy: false, loaded: false };
const API_VIEW = { meta: 'meta', capacity: 'capacity', availability: 'availability', patches: 'patches', security: 'security' };
const SEV_COL = { critical: 'var(--sev-crit)', high: 'var(--sev-high)', medium: 'var(--sev-med)', low: 'var(--sev-low)' };
const RANK = { crit: 4, high: 3, med: 2, low: 1 };

const lowerKeys = o => { const r = {}; for (const [k, v] of Object.entries(o || {})) r[lc(k)] = v; return r; };
const norm = n => lc(n).split('.')[0];

function partOf(view, src) {
  const v = state.data[view];
  if (!v) return { ok: false, error: 'sin respuesta' };
  if (v.fatal) return { ok: false, error: v.fatal };
  return v[src] || { ok: false, error: 'sin datos' };
}

function analyzeSeries(sr) {
  const avg = sr.pts.map(p => [p[0], p[1]]);
  const mx = sr.pts.map(p => [p[0], p[2]]);
  const fit = theilSen(avg);
  const cur = sr.now != null ? sr.now : (avg.length ? avg[avg.length - 1][1] : null);
  const o = { host: sr.host, kind: sr.kind, label: sr.label, now: cur, fit, avg, mx };
  if (sr.kind === 'disk') {
    o.d90 = daysTo(fit, 90, cur);
    o.d100 = daysTo(fit, 100, cur);
    o.perMonth = fit ? fit.slope * 30.4 : null;
  } else {
    // RAM: pico diario. CPU: promedio diario (un pico de un minuto no es falta de CPU)
    o.p95 = percentile(sr.pts.map(p => p[sr.kind === 'cpu' ? 1 : 2]), 0.95);
  }
  return o;
}
function diskTier(o) {
  if (o.now != null && o.now >= 90) return 'crit';
  if (o.d100 != null && o.d100 <= 30) return 'crit';
  if (o.d100 != null && o.d100 <= 90) return 'high';
  if (o.d100 != null && o.d100 <= 180) return 'med';
  if (o.now != null && o.now >= 80) return 'med';
  return 'ok';
}
const byUrgency = (a, b) => ((a.d100 ?? 1e9) - (b.d100 ?? 1e9)) || ((b.now ?? 0) - (a.now ?? 0));

function buildModel() {
  const D = state.data;
  const meta = D.meta && !D.meta.fatal ? D.meta : { roles: {}, aliases: {} };
  const roles = lowerKeys(meta.roles);
  const aliasZ = {};
  for (const [k, v] of Object.entries(meta.aliases || {})) aliasZ[norm(k)] = norm(v);
  const zh = partOf('availability', 'zabbix').ok ? D.availability.zabbix.hosts : [];
  const ags = partOf('availability', 'wazuh').ok ? D.availability.wazuh.agents : [];
  const ents = [], byKey = new Map(), byIp = new Map(), byAlias = new Map();
  const mk = name => {
    const e = { name, key: norm(name), zbx: null, agent: null, vuln: null, os: '', disks: [], ram: null, cpu: null, net: false, role: null, ips: [] };
    ents.push(e); byKey.set(e.key, e); return e;
  };
  for (const z of zh) {
    const e = mk(z.host);
    e.zbx = z; e.net = !!z.network; e.ips = z.ips || [];
    e.ips.forEach(ip => byIp.set(ip, e));
    if (aliasZ[e.key]) byAlias.set(aliasZ[e.key], e);
  }
  const resolve = (name, ip) => byKey.get(norm(name)) || byAlias.get(norm(name)) || (ip && byIp.get(ip)) || null;
  const pcs = [], pcMap = new Map();
  for (const a of ags) {
    let e = resolve(a.name, a.ip);
    if (!e && roles[norm(a.name)]) e = mk(a.name);
    if (e) e.agent = a;
    else { const p = { name: a.name, agent: a, vuln: null }; pcs.push(p); pcMap.set(norm(a.name), p); }
  }
  for (const v of (partOf('patches', 'wazuh').ok ? D.patches.wazuh.agents : [])) {
    let e = resolve(v.name);
    if (!e && roles[norm(v.name)]) e = mk(v.name);
    if (e) { e.vuln = v.counts; e.os = v.os || ''; }
    else {

      if (!p) { p = { name: v.name, agent: null, vuln: null }; pcs.push(p); pcMap.set(norm(v.name), p); }
      p.vuln = v.counts;
    }
  }
  const disks = [], rams = [], cpus = [];
  for (const sr of (partOf('capacity', 'zabbix').ok ? D.capacity.zabbix.series : [])) {
    const e = resolve(sr.host) || mk(sr.host);
    const o = analyzeSeries(sr); o.ent = e;
    if (sr.kind === 'disk') { e.disks.push(o); disks.push(o); }

  for (let i = ents.length - 1; i >= 0; i--) if (ents[i].role && ents[i].role.ignore) ents.splice(i, 1);

}

function nextPatchTuesday() {
  const now = new Date();
  for (let m = 0; m < 3; m++) {
    const d = new Date(now.getFullYear(), now.getMonth() + m, 1);
    const first = ((2 - d.getDay() + 7) % 7) + 1;
    const pt = new Date(d.getFullYear(), d.getMonth(), first + 7, 23, 59, 59);
    if (pt >= now) return pt;
  }
  return now;
}

/* ===== Perímetro: conexiones desde internet y acceso al router (MikroTik por syslog) ===== */
const PORT_NAMES = { 21: 'FTP', 22: 'SSH', 23: 'Telnet', 25: 'SMTP', 53: 'DNS', 80: 'HTTP', 110: 'POP3', 123: 'NTP', 135: 'RPC', 139: 'NetBIOS', 143: 'IMAP', 161: 'SNMP', 389: 'LDAP', 443: 'HTTPS', 445: 'SMB', 993: 'IMAPS', 1433: 'SQL Server', 1521: 'Oracle', 1723: 'PPTP', 3306: 'MySQL', 3389: 'RDP', 5060: 'SIP', 5432: 'PostgreSQL', 5900: 'VNC', 8080: 'HTTP alterno', 8291: 'WinBox', 8728: 'API MikroTik', 34567: 'DVR' };
const portLabel = p => (PORT_NAMES[p] ? p + ' · ' + PORT_NAMES[p] : String(p));

/* RouterOS registra cada acceso dos veces: se muestra una sola fila si son idénticas y seguidas */
function dedupeAccess(rows) {
  const out = [];
  for (const r of rows) {
    const p = out[out.length - 1];
    if (p && p.ok === r.ok && p.user === r.user && p.ip === r.ip && p.via === r.via && Math.abs(p.ts - r.ts) <= 3) continue;
    out.push(r);
  }
  return out;
}

function perimeterCards() {
  const per = partOf('security', 'perimeter');
  if (!per.ok) return [errCard('Perímetro: internet y router', per.error)];
  const S = per.scan, I = per.insist, R = per.router, days = state.days, out = [];
  if (!S.total && !I.total && !R.fail_total && !R.ok_total) {
    return [card({

    })];
  }
  const access = dedupeAccess(R.recent), lastOk = access.find(r => r.ok);
  out.push(kpi({ label: 'Conexiones desde internet (24 h)', value: fmt(S.last24), delta: fmt(S.total) + ' en ' + days + ' días · ' + fmt(S.unique_ips) + ' IP distintas', spark: spark(S.by_day.map(d => [d.ts, d.n])) }));
  out.push(kpi({ label: 'IP que insisten (24 h)', value: fmt(I.last24), delta: I.total + ' en ' + days + ' días · 10 intentos en 5 min' }));
  out.push(kpi({ label: 'Fallos al entrar al router (24 h)', value: fmt(R.fail_last24), delta: R.fail_total + ' en ' + days + ' días' }));
  out.push(kpi({ label: 'Último acceso al router', value: lastOk ? 'hace ' + ago(lastOk.ts) : '—', delta: lastOk ? lastOk.user + ' desde ' + (lastOk.ip || '?') : 'Sin accesos en la ventana' }));

  out.push(card({
    title: 'Conexiones nuevas desde internet por día', cls: 'col-12',
    sub: 'Conexiones TCP nuevas hacia las IP públicas del router (regla 100810). El router registra como máximo 2 por segundo, así que son cifras mínimas. Casi todo son escáneres automáticos: mientras no haya un servicio expuesto en esos puertos no pasa nada; importa quién insiste y a qué puertos.',
    body: responsive(W => colStack(W, { height: 180, data: S.by_day, keys: [{ k: 'n', name: 'Conexiones nuevas', color: 'var(--s1)' }], label: 'Conexiones nuevas desde internet por día' })),
    table: () => tbl([{ h: 'Día', f: d => fmtDay(d.ts) }, { h: 'Conexiones', num: true, f: d => fmt(d.n) }], [...S.by_day].reverse()),
  }));

  const insist = new Set(I.ips.map(x => x.ip));
  out.push(card({
    title: 'IP que más insisten', cls: 'col-8', sub: '"Insiste" = 10 o más intentos en 5 minutos. Si una IP aparece contra puertos que sí tenés abiertos (SQL Server, por ejemplo), esa es la que importa.',
    body: tbl([
      { h: 'IP de origen', f: r => r.ip },
      { h: 'Intentos', num: true, f: r => fmt(r.n) },
      { h: 'Puertos', f: r => r.ports.map(p => portLabel(p.key)).join(', ') },
      { h: 'Última', num: true, f: r => (r.last ? 'hace ' + ago(r.last) : '—') },
      { h: '', f: r => (insist.has(r.ip) ? sevChip('med', 'Insiste') : '') },
    ], S.top_ip, { empty: 'Sin conexiones en el período.' }),
  }));
  out.push(card({
    title: 'Puertos más buscados', cls: 'col-4', sub: 'Lo que los escáneres intentan encontrar abierto.',
    body: h('div', { class: 'row-gap' },
      S.top_port.length ? hbar(S.top_port.slice(0, 8).map(x => ({ label: portLabel(x.key), value: x.n, color: 'var(--s1)', text: fmt(x.n) }))) : h('div', { class: 'muted', text: 'Sin datos' }),
      S.by_link.length > 1 ? h('div', {}, h('div', { class: 'mini-h', text: 'Por enlace' }), hbar(S.by_link.map(x => ({ label: x.key, value: x.n, color: 'var(--s2)', text: fmt(x.n) })))) : null),
  }));

  out.push(card({
    title: 'Acceso a la administración del router', cls: 'col-12',
    sub: 'Reglas 100801 y 100803. WinBox solo acepta tu red interna: un intento fallido desde una IP que no reconocés merece revisarse.',
    body: tbl([

  }));
  return out;
}

/* ===== carga, render y arranque ===== */
async function fetchView(view, days, fresh) {
  if (state.demo) return DEMO.get(view, days);
  const q = new URLSearchParams({ view });
  if (['capacity', 'availability', 'security'].includes(view)) q.set('days', days);
  if (fresh) q.set('fresh', '1');
  const r = await fetch('api.php?' + q, { headers: { Accept: 'application/json' }, cache: 'no-store' });
  let j = null;
  try { j = await r.json(); } catch (e) { /* respuesta no JSON */ }
  if (!r.ok || !j) throw new Error(j && j.error ? j.error : 'HTTP ' + r.status + (r.status === 404 ? ' (¿está api.php junto a esta página?)' : ''));
  return j;
}
async function loadViews(names, fresh) {
  state.busy = true; $main().classList.add('busy');
  const res = await Promise.allSettled(names.map(n => fetchView(API_VIEW[n], state.days, fresh)));
  names.forEach((n, i) => { state.data[n] = res[i].status === 'fulfilled' ? res[i].value : { fatal: res[i].reason.message || String(res[i].reason) }; });
  if (state.anon) {
    names.forEach(n => { state.raw[n] = state.data[n]; });
    anonDiscover(state.raw);
    names.forEach(n => { if (!state.raw[n].fatal) state.data[n] = anonView(n, state.raw[n]); });
  }
  state.busy = false; state.loaded = true; $main().classList.remove('busy');
  render();
}

function boot() {

  th.addEventListener('click', () => {

'use strict';

const TIERS = ['ok', 'low', 'med', 'high', 'crit'];
const TIER_ORDER = { crit: 0, high: 1, med: 2, low: 3, ok: 4 };

function entityTier(e, todo) {
  let r = 0;
  for (const t of todo) if (t.host === e.name) r = Math.max(r, RANK[t.sev]);
  if (e.zbx && e.zbx.state === 'down') r = 4;
  if (e.vuln && e.vuln.critical > 0) r = Math.max(r, 3);
  if (e.agent && e.agent.status !== 'active') r = Math.max(r, 2);
  return TIERS[r];
}
const matchQ = text => { const q = lc(state.q).trim(); return !q || lc(text).includes(q); };

function miniRow(label, v) {

    h('div', { class: 'bar' }, v == null ? null : h('i', { class: k, style: { width: Math.max(1, Math.min(100, v)) + '%' } })),
    h('span', { class: 'val', text: v == null ? '—' : fmt(v) + ' %' }));
}

function diskLines(list, horizon) {
  const colors = new Map();
  [...list].sort((a, b) => (a.ent.name + a.label).localeCompare(b.ent.name + b.label)).forEach((o, i) => colors.set(o, 'var(--s' + ((i % 8) + 1) + ')'));
  const series = [], leg = [];
  let minV = 100, nowT = 0;
  list.forEach(o => {
    const col = colors.get(o), nm = o.ent.name + ' ' + o.label;
    series.push({ name: nm, color: col, pts: o.avg });
    leg.push({ name: nm, color: col });
    const last = o.avg[o.avg.length - 1];
    if (last) { minV = Math.min(minV, ...o.avg.map(p => p[1])); nowT = Math.max(nowT, last[0]); }
    const pp = last ? projPts(o.fit, last[1], last[0], horizon, 100) : [];
    if (pp.length > 1) series.push({ name: nm + ' (proyección)', color: col, pts: pp, dash: true });
  });
  return { series, leg, yMin: Math.max(0, Math.floor((minV - 6) / 10) * 10), nowT };
}

    if (fl) lines.push(h('li', {}, sevIcon('med'), h('div', { class: 't', text: 'Búfer del agente saturado ' + fl.n + ' veces' }), h('div', { class: 'd', text: fl.last ? 'La última, hace ' + ago(fl.last) + '.' : '' })));
    if (lines.length) sec_('Seguridad (Wazuh)', h('ul', { class: 'dlist' }, lines));
  }
  // atajos
  sec_('Ver en otras pestañas', h('div', { class: 'dacts' }, [['Capacidad', 'capacidad'], ['Parches', 'parches'], ['Disponibilidad', 'disponibilidad']].map(([l, v]) => h('button', { class: 'btn', type: 'button', text: l, onclick: () => { closeHost(); go(v, e.name); } }))));
  return { body, tier };
}

let drawerReturn = null;
function openHost(name, trigger) { state.drawer = name; drawerReturn = trigger || document.activeElement; renderDrawer(true); }
function closeHost() {
  state.drawer = null;
  renderDrawer();
  if (drawerReturn && document.contains(drawerReturn)) drawerReturn.focus();
  drawerReturn = null;
}
function renderDrawer(focus) {
  document.getElementById('drawer')?.remove();
  document.getElementById('scrim')?.remove();
  if (!state.drawer || !state.M) return;
  const e = state.M.ents.find(x => x.name === state.drawer);
  if (!e) { state.drawer = null; return; }
  const { body, tier } = hostDetail(state.M, e);
  const close = h('button', { class: 'btn', type: 'button', text: 'Cerrar', 'aria-label': 'Cerrar detalle', onclick: closeHost });
  const d = h('aside', { id: 'drawer', class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'drawer-title' },
    h('div', { class: 'dh' }, h('div', {}, h('h2', { id: 'drawer-title', text: e.name }), h('div', { class: 'muted', text: e.label || (e.net ? 'Equipo de red' : '') }), h('div', { style: { marginTop: '6px' } }, sevChip(tier))), close),
    body);
  document.body.append(h('div', { id: 'scrim', class: 'scrim', onclick: closeHost }), d);
  if (focus) close.focus();
}
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (state.drawer) closeHost(); else if (state.tv) setTv(false); return; }
  if (ev.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
    const q = document.getElementById('q');
    if (q && q.offsetParent) { ev.preventDefault(); q.focus(); q.select(); }
  }
  if (ev.key === 'Tab' && state.drawer) {
    const d = document.getElementById('drawer');
    const f = [...d.querySelectorAll('button, [href], input, select, [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!d.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
    else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});

/* ===== filtros del Resumen, auto-actualización y modo pantalla ===== */
function syncUi(V) {
  document.getElementById('q-wrap').style.display = V.id === 'resumen' ? '' : 'none';
  document.getElementById('sev-wrap').style.display = V.id === 'resumen' ? '' : 'none';
  document.querySelectorAll('#sevf button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.s === state.sevf)));
}
let autoTimer = null, tvTimer = null, clockTimer = null;
function setAuto(min) {
  state.auto = min;
  clearInterval(autoTimer);
  if (min) autoTimer = setInterval(() => loadViews(['meta', 'capacity', 'availability', 'patches', 'security'], true), min * 60000);
  const b = document.getElementById('auto');
  b.textContent = min ? 'Auto: cada ' + min + ' min' : 'Auto: apagado';
  b.setAttribute('aria-pressed', String(!!min));
  try { localStorage.setItem('panel-auto', String(min)); } catch (e) { /* sin storage */ }
}
function syncTv(V) {
  if (!state.tv) return;
  document.getElementById('tv-title').textContent = V.name;
}
function tvTick() {
  const i = VIEWS.findIndex(v => v.id === state.view);
  go(VIEWS[(i + 1) % VIEWS.length].id, 'all');
  const old = document.getElementById('tv-prog'), n = old.cloneNode();
  old.replaceWith(n); // reinicia la animación de la barra
}
function setTv(on) {
  state.tv = on;
  document.documentElement.classList.toggle('tv', on);
  clearInterval(tvTimer); clearInterval(clockTimer);
  if (on) {
    if (state.drawer) closeHost();
    if (!state.auto) setAuto(5);
    tvTimer = setInterval(tvTick, 20000);
    const clk = () => { document.getElementById('tv-clock').textContent = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) + ' · ' + document.getElementById('updated').textContent; };
    clk(); clockTimer = setInterval(clk, 15000);
    const old = document.getElementById('tv-prog'); old.replaceWith(old.cloneNode());
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { /* el navegador puede negarlo */ });
    go('resumen', 'all');
  } else if (document.fullscreenElement) document.exitFullscreen().catch(() => { /* ya salió */ });
  render();
}
function initUi() {
  // severidad
  const sevf = document.getElementById('sevf');
  [['all', 'Todo'], ['crit', 'Críticos'], ['high', 'Altos'], ['med', 'Medios']].forEach(([k, l]) => sevf.append(h('button', { type: 'button', role: 'radio', 'data-s': k, text: l, onclick: () => { state.sevf = k; state.showAll = false; render(); } })));
  // buscador (con pequeña espera para no rearmar todo en cada tecla)
  let t = null;
  document.getElementById('q').addEventListener('input', ev => { clearTimeout(t); t = setTimeout(() => { state.q = ev.target.value; render(); }, 140); });
  // auto y pantalla
  document.getElementById('auto').addEventListener('click', () => setAuto(state.auto ? 0 : 5));
  document.getElementById('tvbtn').addEventListener('click', () => setTv(true));
  document.getElementById('tv-exit').addEventListener('click', () => setTv(false));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && state.tv) setTv(false); });
  let a = 0;
  try { a = Number(localStorage.getItem('panel-auto')) || 0; } catch (e) { /* sin storage */ }
  const qp = new URLSearchParams(location.search);
  if (qp.has('auto')) a = Number(qp.get('auto')) || 5;
  setAuto(a);
  if (qp.has('tv')) setTimeout(() => setTv(true), 0);
}

'use strict';
/* Modo anónimo (?anon=1): reemplaza nombres de equipos, IPs y usuarios por alias genéricos.
   Trabaja sobre los datos al llegar, así que todo lo que se dibuja (tooltips y detalle incluidos) ya sale anonimizado. */
const ANON = { map: new Map(), alias: new Map(), ips: new Map(), users: new Map(), cnt: {}, extra: new Map() };
const ANON_PREFIX = { dc: 'DC', db: 'DB', file: 'FS', app: 'APP', infra: 'HV', backup: 'BKP', monitor: 'MON' };
const ANON_LABEL = { dc: 'Controlador de dominio', db: 'Base de datos', file: 'Servidor de archivos', app: 'Aplicación', infra: 'Infraestructura', backup: 'Respaldos', monitor: 'Monitoreo', other: '' };
const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function anonName(name, prefix) {
  const k = norm(name);
  if (!k || ANON.map.has(k)) return;
  ANON.cnt[prefix] = (ANON.cnt[prefix] || 0) + 1;
  const n = ANON.cnt[prefix];
  ANON.map.set(k, prefix + '-' + String(n).padStart(prefix === 'PC' ? 3 : 2, '0'));
}
function anonDiscover(raw) {
  const ok = v => raw[v] && !raw[v].fatal;
  const roles = ok('meta') ? lowerKeys(raw.meta.roles) : {};
  const zhosts = ok('availability') && raw.availability.zabbix && raw.availability.zabbix.ok ? raw.availability.zabbix.hosts : [];
  const zset = new Set(zhosts.map(z => norm(z.host)));
  const netset = new Set(zhosts.filter(z => z.network).map(z => norm(z.host)));
  const seen = [];
  const add = n => { if (n && typeof n === 'string' && n !== '-') seen.push(n); };
  zhosts.forEach(z => { add(z.host); add(z.name); });
  if (ok('availability') && raw.availability.wazuh && raw.availability.wazuh.ok) raw.availability.wazuh.agents.forEach(a => add(a.name));
  if (ok('availability') && raw.availability.zabbix && raw.availability.zabbix.ok) { raw.availability.zabbix.problems.forEach(p => add(p.host)); raw.availability.zabbix.ifaces.forEach(i => add(i.host)); }
  if (ok('capacity') && raw.capacity.zabbix && raw.capacity.zabbix.ok) raw.capacity.zabbix.series.forEach(x => add(x.host));
  if (ok('patches') && raw.patches.wazuh && raw.patches.wazuh.ok) { raw.patches.wazuh.agents.forEach(a => add(a.name)); raw.patches.wazuh.cves.forEach(c => c.agents.forEach(add)); }
  if (ok('security') && raw.security.wazuh && raw.security.wazuh.ok) {
    const s = raw.security.wazuh;
    s.failed.by_agent.forEach(x => add(x.key)); s.flooded.forEach(x => add(x.agent));
    s.lockouts.recent.forEach(r => { add(r.agent); add(r.caller); });
    s.failed.by_user.forEach(u => { if (!ANON.users.has(u.key)) ANON.users.set(u.key, 'usuario-' + String(ANON.users.size + 1).padStart(2, '0')); });
    s.lockouts.recent.forEach(r => { if (!ANON.users.has(r.user)) ANON.users.set(r.user, 'usuario-' + String(ANON.users.size + 1).padStart(2, '0')); });
  }
  if (ok('security') && raw.security.perimeter && raw.security.perimeter.ok) {
    const R = raw.security.perimeter.router;
    [...R.recent.map(r => r.user), ...R.fail_by_user.map(u => u.key)].forEach(u => { if (!ANON.users.has(u)) ANON.users.set(u, 'usuario-' + String(ANON.users.size + 1).padStart(2, '0')); });
  }
  if (ok('meta')) { Object.keys(raw.meta.roles || {}).forEach(add); Object.entries(raw.meta.aliases || {}).forEach(([a, b]) => { add(a); add(b); }); }
  // los equipos con rol primero, para que DC-01, DB-01… sigan el orden de importancia
  const sorted = [...new Set(seen)].sort((a, b) => ((roles[norm(b)] ? roles[norm(b)].weight : 0) - (roles[norm(a)] ? roles[norm(a)].weight : 0)) || a.localeCompare(b));
  for (const n of sorted) {
    const r = roles[norm(n)];
    const prefix = r ? (ANON_PREFIX[r.role] || 'SRV') : netset.has(norm(n)) ? 'RTR' : /^pc[-_]/i.test(n) || (!zset.has(norm(n)) && !r) ? 'PC' : 'SRV';
    anonName(n, prefix);
  }
  // alias de configuración (NOMBRE-ZABBIX => NOMBRE-WAZUH): mismo equipo, mismo alias
  if (ok('meta')) for (const [z, w] of Object.entries(raw.meta.aliases || {})) if (ANON.map.has(norm(z))) ANON.map.set(norm(w), ANON.map.get(norm(z)));
  // expresiones de reemplazo (nombre completo y nombre corto, el más largo primero)
  const strs = new Map();
  for (const n of seen) { strs.set(n, ANON.map.get(norm(n))); strs.set(n.split('.')[0], ANON.map.get(norm(n))); }
  const list = [...strs.entries()].filter(([k]) => k.length >= 2).sort((a, b) => b[0].length - a[0].length);
  const mk = (arr, flags) => (arr.length ? new RegExp('(?<![A-Za-z0-9_-])(?:' + arr.map(([k]) => esc(k)).join('|') + ')(?![A-Za-z0-9_-])', flags) : null);
  ANON.reShort = mk(list.filter(([k]) => k.length <= 3), 'g');
  ANON.reLong = mk(list.filter(([k]) => k.length > 3), 'gi');
  ANON.lookupCS = new Map(list.map(([k, v]) => [k, v]));
  ANON.lookupCI = new Map(list.map(([k, v]) => [lc(k), v]));
}
const OCT = '(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)';
const IP_RE = new RegExp('\\b' + OCT + '(?:\\.' + OCT + '){3}\\b', 'g');
function anonIp(ip) {
  if (!ANON.ips.has(ip)) { const n = ANON.ips.size; ANON.ips.set(ip, '10.10.' + Math.floor(n / 250) + '.' + ((n % 250) + 1)); }
  return ANON.ips.get(ip);
}
function anonView(name, data) {
  let t = JSON.stringify(data);
  t = t.replace(IP_RE, anonIp);
  if (ANON.reLong) t = t.replace(ANON.reLong, m => ANON.lookupCI.get(lc(m)) || m);
  if (ANON.reShort) t = t.replace(ANON.reShort, m => ANON.lookupCS.get(m) || m);
  const d = JSON.parse(t);
  if (name === 'meta') for (const r of Object.values(d.roles || {})) r.label = ANON_LABEL[r.role] || '';
  if (name === 'security' && d.wazuh && d.wazuh.ok) {
    d.wazuh.failed.by_user.forEach(u => { u.key = ANON.users.get(u.key) || 'usuario'; });
    d.wazuh.lockouts.recent.forEach(r => { r.user = ANON.users.get(r.user) || 'usuario'; });
  }
  if (name === 'security' && d.perimeter && d.perimeter.ok) {
    d.perimeter.router.recent.forEach(r => { r.user = ANON.users.get(r.user) || 'usuario'; });
    d.perimeter.router.fail_by_user.forEach(u => { u.key = ANON.users.get(u.key) || 'usuario'; });
    d.perimeter.scan.by_link.forEach((x, i) => { x.key = 'Enlace ' + (i + 1); });
  }
  if (name === 'patches' && d.wazuh && d.wazuh.ok) d.wazuh.agents.forEach(a => { a.os = a.os.replace(/\s+\d[\d.]*$/, ''); });
  return d;
}
